<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7th Grade Math Practice</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>7th Grade Math Practice</h1>
        <label for="topic">Select Topic:</label>
        <select id="topic">
            <option value="integers">Integers/Rationals</option>
            <option value="fractions">Fractions/Decimals</option>
            <option value="ratios">Ratios/Proportions</option>
            <option value="percent">Percent</option>
            <option value="expressions">Expressions</option>
            <option value="equations">Equations (One-step & Two-step)</option>
            <option value="geometry">Geometry (Area/Circumference)</option>
            <option value="statistics">Statistics (Mean/Median)</option>
        </select>

        <label for="difficulty">Select Difficulty:</label>
        <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
        </select>

        <button id="start-button">Start</button>

        <div id="problem-container">
            <!-- Teaching Mode (collapsible) -->
            <details id="teaching-mode" class="teaching-mode" open>
                <summary><strong>Teaching Mode</strong> (open for a mini-lesson + example)</summary>
                <div id="teaching-content" class="teaching-content">
                    Select a topic and press Start.
                </div>
            </details>

            <!-- Problem + answer -->
            <div id="problem"></div>

            <!-- Scratch Paper (auto-clears each new problem) -->
            <details id="scratchpad" class="scratchpad" open>
                <summary><strong>Scratch Paper</strong> (draw with mouse/touch)</summary>

                <div class="scratchpad-toolbar">
                    <label for="scratch-size"><strong>Pencil size</strong></label>
                    <input id="scratch-size" type="range" min="1" max="12" value="3">
                    <button id="scratch-clear" type="button">Clear</button>
                </div>

                <canvas id="scratch-canvas" width="680" height="260"></canvas>
                <div class="scratchpad-note">Tip: works with mouse or touch.</div>
            </details>

            <div id="hints" class="hints" style="display:none;">
                <div class="hints-title"><strong>Hints</strong></div>
                <div id="hint-content"></div>
            </div>

            <input type="text" id="answer" placeholder="Your answer">
            <button id="submit-button">Submit</button>

            <button id="toggle-solution" disabled title="Unlocks after 3 wrong attempts">Show Step-by-Step Work</button>
            <div id="solution" style="display:none;"></div>

            <div id="score">Score: 0</div>
            <div id="streak">Streak: 0</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
