<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch Paper</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Scratch Paper</h1>
        <canvas id="scratchpad" width="500" height="400"></canvas>
        <br>
        <label for="pencilSize">Pencil Size:</label>
        <input type="range" id="pencilSize" min="1" max="10" value="5">
        <button id="clearButton">Clear</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
